name: FantasyEAi Android test APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/multi-league-auth-android-20261024
permissions:
  contents: read
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@07976c6290703d34c16d382cb36445f98bb43d7 # v3
      - name: Install pinned JS dependencies
        run: |
          npm ci
          npm install --no-save @capacitor/core@8.0.0 @capacitor/android@8.0.0 @capacitor/cli@8.0.0
      - name: Build web UI
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Build unsigned-for-distribution debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish APK test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FantasyEAi-Android-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
